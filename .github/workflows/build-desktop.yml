  dotnet:
    name: Build .NET Desktop Applications
    runs-on: windows-latest

    steps:
      - name: Checkout desktop repository
        uses: actions/checkout@v4

      - name: Clone application repositories
        shell: bash
        run: bash ./orchestrator.sh clone

      - name: Setup Java 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22.0.1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Verify Inno Setup
        shell: powershell
        run: |
          $innoPath = "C:\Program Files (x86)\Inno Setup 6"
          $iscc = "$innoPath\ISCC.exe"

          if (-not (Test-Path $iscc)) {
              Write-Error "Inno Setup was not found at $iscc"
              exit 1
          }

          Write-Host "Inno Setup found:"
          Write-Host $iscc

          Add-Content $env:GITHUB_PATH $innoPath

      - name: Build frontend and backend
        shell: bash
        run: bash ./orchestrator.sh build

      - name: Build .NET installers
        shell: bash
        run: bash ./orchestrator.sh dotnet-installers

      - name: Upload .NET installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-installers
          path: dotnet/publish/installers/*.exe
          if-no-files-found: warn
          retention-days: 7