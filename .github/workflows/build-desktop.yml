name: Build Desktop Applications

on:
  workflow_dispatch:
    inputs:
      pipeline:
        description: "Select desktop pipeline to build"
        required: true
        default: all
        type: choice
        options:
          - electron
          - tauri
          - dotnet
          - all

      release:
        description: "GitHub release tag"
        required: true
        default: desktop-showcase
        type: string

permissions:
  contents: write

jobs:
  electron:
    if: ${{ github.event.inputs.pipeline == 'electron' || github.event.inputs.pipeline == 'all' }}
    name: Build Electron
    runs-on: windows-latest

    steps:
      - name: Checkout desktop repository
        uses: actions/checkout@v4

      - name: Clone application repositories
        shell: bash
        run: bash ./orchestrator.sh clone

      - name: Setup Java 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22.0.1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Build frontend and backend
        shell: bash
        run: bash ./orchestrator.sh build

      - name: Package Electron
        shell: bash
        run: bash ./orchestrator.sh electron-package

      - name: Check Electron installer
        id: check_electron
        if: always()
        shell: powershell
        run: |
          $installer = Get-ChildItem "electron/release" -Filter "*.exe" -File -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($installer) {
              Write-Host "Electron installer: $($installer.Name)"
              "found=true" >> $env:GITHUB_OUTPUT
              "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          }
          else {
              Write-Host "Electron installer was not found."
              "found=false" >> $env:GITHUB_OUTPUT
          }

      - name: Publish Electron installer to release
        if: steps.check_electron.outputs.found == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = "${{ inputs.release }}"
          $installer = "${{ steps.check_electron.outputs.installer }}"

          Write-Host "Uploading Electron installer:"
          Write-Host $installer

          gh release upload $releaseTag `
            "$installer" `
            --repo "${{ github.repository }}" `
            --clobber

      # - name: Upload Electron installer
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: electron-installer
      #     path: electron/release/*.exe
      #     if-no-files-found: warn
      #     retention-days: 7

  tauri:
    if: ${{ github.event.inputs.pipeline == 'tauri' || github.event.inputs.pipeline == 'all' }}
    name: Build Tauri
    runs-on: windows-latest

    steps:
      - name: Checkout desktop repository
        uses: actions/checkout@v4

      - name: Clone application repositories
        shell: bash
        run: bash ./orchestrator.sh clone

      - name: Setup Java 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22.0.1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: x86_64-pc-windows-msvc

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version 2.11.4

      - name: Build frontend and backend
        shell: bash
        run: bash ./orchestrator.sh build

      - name: Package Tauri
        shell: bash
        run: bash ./orchestrator.sh tauri-package

      - name: Check Tauri installer
        id: check_tauri
        if: always()
        shell: powershell
        run: |
          $installer = Get-ChildItem "tauri/src-tauri/target/release/bundle/nsis" `
            -Filter "*.exe" `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($installer) {
              Write-Host "Tauri installer: $($installer.Name)"
              "found=true" >> $env:GITHUB_OUTPUT
              "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          }
          else {
              Write-Host "Tauri installer was not found."
              "found=false" >> $env:GITHUB_OUTPUT
          }

      - name: Publish Tauri installer to release
        if: steps.check_tauri.outputs.found == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = "${{ inputs.release }}"
          $installer = "${{ steps.check_tauri.outputs.installer }}"

          Write-Host "Uploading Tauri installer:"
          Write-Host $installer

          gh release upload $releaseTag `
            "$installer" `
            --repo "${{ github.repository }}" `
            --clobber

      # - name: Upload Tauri installer
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: tauri-installer
      #     path: tauri/src-tauri/target/release/bundle/nsis/*.exe
      #     if-no-files-found: warn
      #     retention-days: 7

  dotnet:
    if: ${{ github.event.inputs.pipeline == 'dotnet' || github.event.inputs.pipeline == 'all' }}
    name: Build .NET Desktop Applications
    runs-on: windows-latest

    steps:
      - name: Checkout desktop repository
        uses: actions/checkout@v4

      - name: Clone application repositories
        shell: bash
        run: bash ./orchestrator.sh clone

      - name: Setup Java 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22.0.1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Verify Inno Setup
        shell: powershell
        run: |
          $innoPath = "C:\Program Files (x86)\Inno Setup 6"
          $iscc = "$innoPath\ISCC.exe"

          if (-not (Test-Path $iscc)) {
              Write-Error "Inno Setup was not found at $iscc"
              exit 1
          }

          Write-Host "Inno Setup found:"
          Write-Host $iscc

          Add-Content $env:GITHUB_PATH $innoPath

      - name: Build frontend and backend
        shell: bash
        run: bash ./orchestrator.sh build

      - name: Prepare .NET resources
        shell: bash
        run: bash ./orchestrator.sh dotnet-prepare

      - name: Publish WPF
        id: wpf_publish
        continue-on-error: true
        shell: bash
        run: bash ./orchestrator.sh dotnet-publish-wpf

      - name: Create WPF installer
        if: steps.wpf_publish.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: bash ./orchestrator.sh dotnet-installer-wpf

      - name: Publish WinUI 3
        id: winui3_publish
        if: always()
        continue-on-error: true
        shell: bash
        run: bash ./orchestrator.sh dotnet-publish-winui3

      - name: Create WinUI 3 installer
        if: always() && steps.winui3_publish.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: bash ./orchestrator.sh dotnet-installer-winui3

      - name: Publish WinUI 3 single-file
        id: winui3_single_publish
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          dotnet clean dotnet/WinUI3/WinUI3.csproj
          rm -rf dotnet/WinUI3/bin
          rm -rf dotnet/WinUI3/obj
          bash ./orchestrator.sh dotnet-publish-single

      - name: Create WinUI 3 single-file installer
        if: always() && steps.winui3_single_publish.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: bash ./orchestrator.sh dotnet-installer-single

      - name: Check .NET installers
        id: check_dotnet
        if: always()
        shell: powershell
        run: |
          $installers = Get-ChildItem "dotnet/publish/installers" `
            -Filter "*.exe" `
            -File `
            -ErrorAction SilentlyContinue

          if ($installers) {
              Write-Host "Generated .NET installers:"

              "found=true" >> $env:GITHUB_OUTPUT

              $paths = @()

              foreach ($installer in $installers) {
                  Write-Host "- $($installer.Name)"
                  $paths += $installer.FullName
              }

              "installers<<EOF" >> $env:GITHUB_OUTPUT
              $paths | ForEach-Object { $_ } >> $env:GITHUB_OUTPUT
              "EOF" >> $env:GITHUB_OUTPUT
          }
          else {
              Write-Host "No .NET installers were found."
              "found=false" >> $env:GITHUB_OUTPUT
          }

      - name: Publish .NET installers to release
        if: steps.check_dotnet.outputs.found == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = "${{ inputs.release }}"
          $installers = "${{ steps.check_dotnet.outputs.installers }}" -split "`n"

          foreach ($installer in $installers) {
              $installer = $installer.Trim()

              if ($installer) {
                  Write-Host "Uploading .NET installer:"
                  Write-Host $installer

                  gh release upload $releaseTag `
                    "$installer" `
                    --repo "${{ github.repository }}" `
                    --clobber
              }
          }

      # - name: Upload .NET installers
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: dotnet-installers
      #     path: dotnet/publish/installers/*.exe
      #     if-no-files-found: warn
      #     retention-days: 7

      - name: Restore MSIX signing certificate
        shell: powershell
        env:
          MSIX_CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
        run: |
          $certificatePath = "$env:GITHUB_WORKSPACE\dotnet\JobApplicationTracker-Dev.pfx"

          $bytes = [Convert]::FromBase64String($env:MSIX_CERTIFICATE_BASE64)

          [System.IO.File]::WriteAllBytes(
              $certificatePath,
              $bytes
          )

          Write-Host "MSIX signing certificate restored."

      - name: Build and sign MSIX
        id: msix
        if: always()
        continue-on-error: true
        shell: bash
        env:
          MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
        run: bash ./dotnet/scripts/build-msix.sh

      - name: Check signed MSIX
        id: check_msix
        if: always()
        shell: powershell
        run: |
          $msix = Get-ChildItem "dotnet/publish/WinUI3-MSIX" `
            -Filter "*.msix" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($msix) {
              Write-Host "Signed MSIX: $($msix.Name)"
              "found=true" >> $env:GITHUB_OUTPUT
              "msix=$($msix.FullName)" >> $env:GITHUB_OUTPUT
          }
          else {
              Write-Host "Signed MSIX was not found."
              "found=false" >> $env:GITHUB_OUTPUT
          }

      - name: Publish signed MSIX to release
        if: steps.check_msix.outputs.found == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = "${{ inputs.release }}"
          $msix = "${{ steps.check_msix.outputs.msix }}"

          Write-Host "Uploading signed MSIX:"
          Write-Host $msix

          gh release upload $releaseTag `
            "$msix" `
            --repo "${{ github.repository }}" `
            --clobber

      # - name: Upload signed MSIX
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: dotnet-msix
      #     path: dotnet/publish/WinUI3-MSIX/**/*.msix
      #     if-no-files-found: warn
      #     retention-days: 7

      - name: Remove MSIX signing certificate
        if: always()
        shell: powershell
        run: |
          Remove-Item `
            "$env:GITHUB_WORKSPACE\dotnet\JobApplicationTracker-Dev.pfx" `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "MSIX signing certificate removed."