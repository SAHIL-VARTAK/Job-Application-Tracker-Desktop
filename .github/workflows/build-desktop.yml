name: Build Desktop Applications

on:
  workflow_dispatch:

  push:
    branches:
      - task/github-actions-workflow

permissions:
  contents: read

jobs:
  electron:
    name: Build Electron
    runs-on: windows-latest

    steps:
      - name: Checkout desktop repository
        uses: actions/checkout@v4

      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Clone application repositories
        shell: bash
        run: bash ./orchestrator.sh clone

      - name: Build frontend and backend
        shell: bash
        run: bash ./orchestrator.sh build

      - name: Package Electron
        shell: bash
        run: bash ./orchestrator.sh electron-package

      - name: Upload Electron installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-installer
          path: electron/release/*.exe
          if-no-files-found: warn
          retention-days: 14

  tauri:
    name: Build Tauri
    runs-on: windows-latest

    steps:
      - name: Checkout desktop repository
        uses: actions/checkout@v4

      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2"

      - name: Clone application repositories
        shell: bash
        run: bash ./orchestrator.sh clone

      - name: Build frontend and backend
        shell: bash
        run: bash ./orchestrator.sh build

      - name: Package Tauri
        shell: bash
        run: bash ./orchestrator.sh tauri-package

      - name: Upload Tauri installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-installer
          path: tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14

  dotnet:
    name: Build .NET Desktop Applications
    runs-on: windows-latest

    steps:
      - name: Checkout desktop repository
        uses: actions/checkout@v4

      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Clone application repositories
        shell: bash
        run: bash ./orchestrator.sh clone

      - name: Build frontend and backend
        shell: bash
        run: bash ./orchestrator.sh build

      - name: Build .NET installers
        shell: bash
        run: bash ./orchestrator.sh dotnet-installers

      - name: Upload .NET installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-installers
          path: dotnet/publish/installers/*.exe
          if-no-files-found: warn
          retention-days: 14
