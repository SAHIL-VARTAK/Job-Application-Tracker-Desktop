<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Job Application Tracker</title>

    <style>
        :root {
            --error: #d32f2f;
            --background: #f5f5f5;
            --text: #212121;
            --text-secondary: #666666;
            --error-background: #ffebee;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: var(--background);
            color: var(--text);

            user-select: none;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: var(--background);
        }

        .error-icon {
            width: 64px;
            height: 64px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 20px;

            border-radius: 50%;
            background: var(--error-background);
            color: var(--error);

            font-size: 32px;
            font-weight: 600;
        }

        h1 {
            margin: 0;

            font-size: 24px;
            font-weight: 600;
            text-align: center;
        }

        .subtitle {
            margin: 8px 0 22px;

            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
        }

        .error-message {
            width: min(500px, 80%);
            padding: 12px 14px;

            margin-bottom: 20px;

            border-radius: 6px;
            background: var(--error-background);

            color: #8e0000;

            font-family: Consolas, monospace;
            font-size: 12px;
            line-height: 1.5;

            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .instruction {
            margin: 0;

            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.5;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #121212;
                --text: #ffffff;
                --text-secondary: #aaaaaa;
                --error-background: #3b1719;
            }

            .error-message {
                color: #ffb4ab;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="error-icon">
            !
        </div>

        <h1>Unable to Start</h1>

        <div class="subtitle">
            Job Application Tracker could not start.
        </div>

        <div
            id="error"
            class="error-message"
        >
            Unknown startup error.
        </div>

        <p class="instruction">
            Please close the application and try again.
        </p>

    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const message = params.get("message");

        if (message) {
            document.getElementById("error").textContent = message;
        }
    </script>

</body>
</html>
