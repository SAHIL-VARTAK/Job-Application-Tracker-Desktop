<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Job Application Tracker</title>

    <style>
        :root {
            --primary: #1976d2;
            --secondary: #2e7d32;
            --background: #f5f5f5;
            --surface: #ffffff;
            --text: #212121;
            --text-secondary: #666666;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #f5f5f5;
            color: #212121;

            user-select: none;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: #f5f5f5;

            box-shadow: none;
        }

        .logo {
            width: 64px;
            height: 64px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 20px;

            border-radius: 12px;

            overflow: hidden;
        }

        .logo img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        h1 {
            margin: 0;

            font-size: 24px;
            font-weight: 600;
            text-align: center;
        }

        .subtitle {
            margin: 8px 0 28px;

            font-size: 14px;
            color: #666666;
            text-align: center;
        }

        .spinner {
            width: 32px;
            height: 32px;

            border: 3px solid rgba(25, 118, 210, 0.2);
            border-top-color: #1976d2;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        .status {
            margin-top: 16px;

            font-size: 13px;
            color: #666666;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-color-scheme: dark) {
            body,
            .container {
                background: #121212;
                color: #ffffff;
            }

            .subtitle,
            .status {
                color: #aaaaaa;
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #121212;
                --surface: #1e1e1e;
                --text: #ffffff;
                --text-secondary: #aaaaaa;
            }

            .container {
                box-shadow:
                    0 3px 8px rgba(0, 0, 0, 0.4),
                    0 1px 4px rgba(0, 0, 0, 0.3);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            <img src="icon.ico" alt="Logo" />
        </div>

        <h1>Job Application Tracker</h1>

        <div class="subtitle">
            Starting application...
        </div>

        <div class="spinner"></div>

        <div class="status">
            Preparing your workspace
        </div>
    </div>

</body>
</html>
